<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政府新聞稿自動排版工具</title>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 900px; 
            margin: auto; 
            background-color: #f0f4f8; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { 
            color: #2c3e50; 
            text-align: center; 
            margin-bottom: 5px; 
        }
        .subtitle { 
            text-align: center; 
            color: #7f8c8d; 
            margin-bottom: 25px; 
        }
        .input-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #34495e; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        button { 
            background-color: #3498db; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold; 
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #2980b9; 
        }
        button:disabled { 
            background-color: #95a5a6; 
            cursor: not-allowed; 
        }
        #status { 
            margin-top: 15px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 15px;
        }
        #preview { 
            margin-top: 30px; 
            border-collapse: collapse; 
            width: 100%; 
            display: none; 
            font-size: 14px;
            table-layout: fixed;    /* 固定表格佈局，防止撐爆容器 */
            word-wrap: break-word;  /* 強制長文字或 URL 自動換行 */
        }
        #preview th, #preview td { 
            border: 1px solid #ecf0f1; 
            padding: 12px; 
            text-align: left; 
            vertical-align: top; 
            width: 50%; 
            white-space: pre-wrap; 
            tab-size: 4; 
        }
        #preview th { 
            background-color: #f7f9fa; 
            color: #2c3e50; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 政府新聞稿一鍵 Word 排版工具</h2>
    <p class="subtitle">支援 info.gov.hk 及各大政府部門 (如 tlb.gov.hk) 的新聞稿<br><small style="color:#e74c3c;">💡 建議安裝並開啟「Allow CORS」瀏覽器擴充功能以獲得最佳速度</small></p>
    
    <div class="input-group">
        <label>中文新聞稿網址：</label>
        <input type="text" id="zhUrl" placeholder="例如: https://www.info.gov.hk/... 或 https://www.tlb.gov.hk/...">
    </div>
    
    <div class="input-group">
        <label>英文新聞稿網址：</label>
        <input type="text" id="enUrl" placeholder="例如: https://www.info.gov.hk/... 或 https://www.tlb.gov.hk/...">
    </div>

    <button id="convertBtn" onclick="processUrls()">📥 獲取內容並下載 Word (DOCX)</button>
    <p id="status"></p>

    <table id="preview">
        <thead>
            <tr>
                <th>中文內容預覽</th>
                <th>英文內容預覽</th>
            </tr>
        </thead>
        <tbody id="previewBody"></tbody>
    </table>
</div>

<script>
    // 清理段落開頭的所有空白和 Tab
    const stripLeadingWhitespace = (str) => str.replace(/^[\s\u3000\xA0]+/g, '');

    // 清理新聞稿結尾的標準格式和無用字元
    function cleanBottomParas(paras) {
        let cleanParas = [...paras];
        while (cleanParas.length > 0) {
            const lastP = cleanParas[cleanParas.length - 1].trim();
            const isEndMark = lastP.match(/^(NNNN|完|Ends.*|Issued at.*|香港時間.*時.*分)$/i) || 
                              lastP.match(/^\d{4}年\d{1,2}月\d{1,2}日.*$/) ||
                              lastP === "";
            if (isEndMark) {
                cleanParas.pop();
            } else {
                break;
            }
        }
        return cleanParas;
    }

    async function fetchContent(url) {
        let htmlStr = null;
        console.log(`正在嘗試直接連線: ${url}`);
        
        // 1. 優先嘗試「直接連線」(配合 Allow CORS Extension)
        try {
            const directResponse = await fetch(url);
            if (directResponse.ok) {
                htmlStr = await directResponse.text();
                if (htmlStr && htmlStr.length > 500) {
                    console.log('✅ 直接連線成功！(CORS 限制已解除)');
                }
            }
        } catch (e) {
            console.warn('⚠️ 直接連線失敗，正在轉用 Proxy 後備方案...');
        }

        // 2. 如果直接連線失敗，才使用 Proxy 輪詢
        if (!htmlStr || htmlStr.length < 500) {
            const proxies = [
                { url: `https://thingproxy.freeboard.io/fetch/${url}`, type: 'text' },
                { url: `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, type: 'json' },
                { url: `https://corsproxy.io/?${encodeURIComponent(url)}`, type: 'text' },
                { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, type: 'text' }
            ];

            for (const proxy of proxies) {
                try {
                    console.log(`正在嘗試代理: ${proxy.url}`);
                    const response = await fetch(proxy.url);
                    if (response.ok) {
                        if (proxy.type === 'json') {
                            const data = await response.json();
                            htmlStr = data.contents;
                        } else {
                            htmlStr = await response.text();
                        }
                        if (htmlStr && htmlStr.length > 500) {
                            console.log('✅ 代理連線成功！');
                            break; 
                        }
                    }
                } catch (e) {
                    console.warn(`⚠️ 代理失敗: ${proxy.url}`);
                }
            }
        }

        if (!htmlStr || htmlStr.length < 500) {
            throw new Error('無法連線！政府防火牆阻擋了請求。請安裝並開啟「Allow CORS」擴充功能再試。');
        }
        
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlStr, "text/html");
            
            let pageTitle = doc.title || "";
            pageTitle = pageTitle.replace(/(\s*[-|]\s*)?(Press Releases|The Government of the Hong Kong Special Administrative Region|香港特別行政區政府新聞公報|新聞公報|香港特别行政区政府新闻公报|Transport and Logistics Bureau|運輸及物流局).*$/i, "").trim();

            function extractTextWithNewlines(node) {
                if (!node) return "";
                let text = "";
                for (let child of node.childNodes) {
                    if (child.nodeType === Node.TEXT_NODE) {
                        text += child.nodeValue;
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        const tagName = child.tagName.toLowerCase();
                        if (tagName === "br") {
                            text += "\n";
                        } else if (tagName === "p" || tagName === "div" || tagName === "h1" || tagName === "h2") {
                            text += "\n" + extractTextWithNewlines(child) + "\n";
                        } else {
                            text += extractTextWithNewlines(child);
                        }
                    }
                }
                return text;
            }
            
            const prTitleNode = doc.getElementById("pr_title") || doc.querySelector("h1");
            let bodyNode = doc.getElementById("pressrelease") || 
                           doc.querySelector(".pressrelease") ||
                           doc.getElementById("content") ||
                           doc.querySelector("#main") ||
                           doc.querySelector("main") ||
                           doc.querySelector(".content");
            
            if (!bodyNode) {
                const junk = doc.querySelectorAll("script, style, nav, header, footer, aside, .menu, #menu, .sidebar, #sidebar, iframe, noscript");
                junk.forEach(el => el.remove());
                bodyNode = doc.body;
            }

            // 抽取並替換表格代碼
            const tablesData = [];
            const tables = bodyNode.querySelectorAll("table");
            tables.forEach((table, index) => {
                let rowData = [];
                const rows = table.querySelectorAll("tr");
                rows.forEach(tr => {
                    let cellData = [];
                    const cells = tr.querySelectorAll("th, td");
                    cells.forEach(c => {
                        cellData.push(c.innerText.trim());
                    });
                    rowData.push(cellData);
                });
                tablesData.push(rowData);

                const placeholder = doc.createTextNode(`\n[[[TABLE_${index}]]]\n`);
                table.parentNode.replaceChild(placeholder, table);
            });

            let fullText = "";
            if (prTitleNode && !bodyNode.contains(prTitleNode)) {
                fullText += extractTextWithNewlines(prTitleNode) + "\n";
            }
            fullText += extractTextWithNewlines(bodyNode);
            
            let paras = fullText.split('\n')
                .map(p => p.trim())
                .filter(p => p.length > 0);

            // 過濾 TLB 及其他部門網頁的導航與 JS 殘留字眼
            paras = paras.filter(p => {
                const strForMatch = p.toLowerCase().replace(/\s+/g, '');
                if (strForMatch.includes("createtopmenu();") || 
                    strForMatch.includes("createpress();") || 
                    strForMatch.includes("createsitemap();") || 
                    strForMatch.includes("createfooter();")) {
                    return false; 
                }
                const exactJunk = ["主頁", "home", "新聞公報及演講辭", "pressreleasesandspeeches", "新聞公報", "pressreleases", "press", "releasesandspeeches", "releases"];
                if (exactJunk.includes(strForMatch)) {
                    return false; 
                }
                return true; 
            });
            
            return { title: pageTitle, paras: paras, tables: tablesData };

        } catch (error) {
            console.error("解析錯誤:", error);
            throw new Error("成功抓取網頁，但解析內容失敗");
        }
    }

    async function processUrls() {
        const zhUrl = document.getElementById('zhUrl').value.trim();
        const enUrl = document.getElementById('enUrl').value.trim();
        const statusLabel = document.getElementById('status');
        const btn = document.getElementById('convertBtn');
        const previewTable = document.getElementById('preview');
        const previewBody = document.getElementById('previewBody');

        if (!zhUrl || !enUrl) {
            statusLabel.style.color = "#e74c3c";
            statusLabel.innerText = "⚠️ 請填寫中英文兩條網址！";
            return;
        }

        try {
            btn.disabled = true;
            statusLabel.style.color = "#2980b9";
            statusLabel.innerText = "⏳ 正在跨網抓取資料，請稍候...";
            previewTable.style.display = "none";
            previewBody.innerHTML = "";

            const [zhData, enData] = await Promise.all([
                fetchContent(zhUrl),
                fetchContent(enUrl)
            ]);

            if (zhData.paras.length === 0 || enData.paras.length === 0) {
                statusLabel.style.color = "#e74c3c";
                statusLabel.innerText = "❌ 找不到新聞稿正文，請確認網址。";
                btn.disabled = false;
                return;
            }

            statusLabel.style.color = "#27ae60";
            statusLabel.innerText = "✅ 成功讀取內容！正在幫你排版及匯出 Word...";

            let realEnTitle = enData.title; 
            let realZhTitle = zhData.title;

            const foundEnTitle = enData.paras.find(p => p.match(/LCQ\d+\s*:/i));
            if (foundEnTitle) realEnTitle = foundEnTitle;

            const foundZhTitle = zhData.paras.find(p => p.match(/立法會.+題\s*[：:]/));
            if (foundZhTitle) realZhTitle = foundZhTitle;

            let docTitle = realEnTitle || "中英對照新聞稿";
            docTitle = docTitle.replace(/[\\/:*?"<>|]/g, "_").trim();
            if (docTitle.length > 120) docTitle = docTitle.substring(0, 120).trim();

            function cleanTopParas(paras, titleStr, isZh) {
                let startIdx = 0;
                for(let i = 0; i < Math.min(15, paras.length); i++) {
                    const p = paras[i];
                    const isStars = p.replace(/\s/g, '').split('*').length > 4 || p.replace(/\s/g, '').split('＊').length > 4;
                    const isTitleMatch = titleStr && titleStr.length > 5 && (p.includes(titleStr) || titleStr.includes(p));
                    const isSpecificFormat = isZh ? p.match(/立法會.+題\s*[：:]/) : p.match(/LCQ\d+\s*:/i);
                    const isDateOrMeta = p.match(/(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+[a-zA-Z]+/i) || p.match(/^\d{4}年\d{1,2}月\d{1,2}日/);
                    
                    if (isStars || isTitleMatch || isSpecificFormat || isDateOrMeta) {
                        startIdx = i + 1; 
                    }
                }
                return paras.slice(startIdx);
            }

            let cleanedZhParas = cleanTopParas(zhData.paras, realZhTitle, true);
            cleanedZhParas = cleanBottomParas(cleanedZhParas);

            let cleanedEnParas = cleanTopParas(enData.paras, realEnTitle, false);
            cleanedEnParas = cleanBottomParas(cleanedEnParas);

            const zhStars = "＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊";
            const enStars = "********************************************";

            const cleanZhUrl = zhUrl.replace(/\?fontSize=\d+/g, "");
            const cleanEnUrl = enUrl.replace(/\?fontSize=\d+/g, "");

            const finalZhParas = [realZhTitle, zhStars, cleanZhUrl, ...cleanedZhParas.map(p => "\t" + stripLeadingWhitespace(p))];
            const finalEnParas = [realEnTitle, enStars, cleanEnUrl, ...cleanedEnParas.map(p => "\t" + stripLeadingWhitespace(p))];

            const maxLen = Math.max(finalZhParas.length, finalEnParas.length);
            for (let i = 0; i < maxLen; i++) {
                const tr = document.createElement("tr");
                const tdZh = document.createElement("td");
                tdZh.innerText = finalZhParas[i] || "";
                const tdEn = document.createElement("td");
                tdEn.innerText = finalEnParas[i] || "";
                tr.appendChild(tdZh);
                tr.appendChild(tdEn);
                previewBody.appendChild(tr);
            }
            previewTable.style.display = "table";

            generateDocx(finalZhParas, finalEnParas, maxLen, docTitle, zhData.tables, enData.tables);
            
            setTimeout(() => {
                statusLabel.innerText = "🎉 大功告成！Word 檔案已經彈出下載。";
            }, 1000);

        } catch (error) {
            statusLabel.style.color = "#e74c3c";
            statusLabel.innerText = `❌ 發生錯誤：${error.message}`;
        } finally {
            btn.disabled = false;
        }
    }

    // 將段落砌成 Word 雙列表格，並支援巢狀表格
    function generateDocx(zhParas, enParas, maxLen, docTitle, zhTables, enTables) {
        const tableRows = [];
        
        const formatTextRules = (text) => {
            let newText = text.replace(/（/g, '(').replace(/）/g, ')');
            while (/(\d)[,\s](\d{3})(?!\d)/.test(newText)) {
                newText = newText.replace(/(\d)[,\s](\d{3})(?!\d)/g, '$1\u00A0$2');
            }
            newText = newText.replace(/(\d{3,})\s*([a-zA-Z\u4e00-\u9fa5])/g, '$1\u00A0$2');
            return newText;
        };

        // 為長字串加入零寬空格 (\u200B)，強制換行防止撐爆表格
        const addWordBreaks = (str) => {
            if (!str) return str;
            let res = str.replace(/([/.\?=&])/g, '$1\u200B');
            res = res.replace(/(\*|＊)/g, '$1\u200B');
            return res;
        };

        const createZhParagraph = (text, isBold = false, isUrl = false) => {
            if (!isUrl) text = formatTextRules(text);
            text = addWordBreaks(text);

            const runs = [];
            if (text.startsWith('\t')) {
                runs.push(new docx.TextRun("\t"));
                text = text.substring(1);
            }

            const tokens = text.split(/(○|\d+)/g).filter(Boolean);
            tokens.forEach(token => {
                let fontName = undefined; 
                if (token === "○") { fontName = "PMingLiU"; } 
                else if (/^\d+$/.test(token)) { fontName = "Times New Roman"; }

                runs.push(new docx.TextRun({
                    text: token, 
                    size: 20, 
                    font: fontName, 
                    characterSpacing: isUrl ? undefined : 20, 
                    bold: isBold
                }));
            });

            return new docx.Paragraph({ 
                children: runs, 
                alignment: isUrl ? docx.AlignmentType.LEFT : docx.AlignmentType.JUSTIFIED, 
                keepLines: true, 
                widowControl: true
            });
        };

        const createEnParagraph = (text, isBold = false, isUrl = false) => {
            if (!isUrl) text = formatTextRules(text);
            text = addWordBreaks(text);

            const runs = [];
            if (text.startsWith('\t')) {
                runs.push(new docx.TextRun("\t"));
                text = text.substring(1);
            }
            runs.push(new docx.TextRun({
                text: text, 
                size: 18, 
                font: "Times New Roman", 
                bold: isBold
            }));
            return new docx.Paragraph({ 
                children: runs, 
                alignment: isUrl ? docx.AlignmentType.LEFT : docx.AlignmentType.JUSTIFIED, 
                keepLines: true, 
                widowControl: true
            });
        };

        const createNestedTable = (tableData, isZh) => {
            const rows = tableData.map(row => {
                return new docx.TableRow({
                    cantSplit: true, 
                    children: row.map(cellText => {
                        return new docx.TableCell({
                            margins: { top: 60, bottom: 60, left: 60, right: 60 },
                            children: [isZh ? createZhParagraph(cellText) : createEnParagraph(cellText)]
                        });
                    })
                });
            });

            return new docx.Table({
                width: { size: 100, type: docx.WidthType.PERCENTAGE },
                layout: docx.TableLayoutType.AUTOFIT,
                rows: rows,
                borders: {
                    top: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    left: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    right: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    insideHorizontal: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    insideVertical: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                }
            });
        };

        for (let i = 0; i < maxLen; i++) {
            const zhText = zhParas[i] || "";
            const enText = enParas[i] || "";
            const isTitle = (i === 0);
            
            const isUrlRow = zhText.trim().startsWith("http"); 
            
            const zhTableMatch = zhText.match(/\[\[\[TABLE_(\d+)\]\]\]/);
            const enTableMatch = enText.match(/\[\[\[TABLE_(\d+)\]\]\]/);

            let zhContent, enContent;

            if (zhTableMatch && zhTables[zhTableMatch[1]]) {
                zhContent = createNestedTable(zhTables[zhTableMatch[1]], true);
            } else {
                zhContent = createZhParagraph(zhText, isTitle, isUrlRow);
            }

            if (enTableMatch && enTables[enTableMatch[1]]) {
                enContent = createNestedTable(enTables[enTableMatch[1]], false);
            } else {
                enContent = createEnParagraph(enText, isTitle, isUrlRow);
            }
            
            tableRows.push(
                new docx.TableRow({
                    cantSplit: true,
                    children: [
                        new docx.TableCell({
                            width: { size: 50, type: docx.WidthType.PERCENTAGE },
                            margins: { top: 0, bottom: 0, left: 108, right: 108 },
                            children: [zhContent, new docx.Paragraph({ text: "" })],
                        }),
                        new docx.TableCell({
                            width: { size: 50, type: docx.WidthType.PERCENTAGE },
                            margins: { top: 0, bottom: 0, left: 108, right: 108 },
                            children: [enContent, new docx.Paragraph({ text: "" })],
                        }),
                    ],
                })
            );
        }

        const doc = new docx.Document({
            sections: [{
                properties: {
                    page: {
                        margin: { top: 567, bottom: 567, left: 567, right: 567 },
                    },
                },
                children: [
                    new docx.Table({
                        width: { size: 100, type: docx.WidthType.PERCENTAGE },
                        layout: docx.TableLayoutType.FIXED,
                        borders: {
                            top: { style: docx.BorderStyle.NONE },
                            bottom: { style: docx.BorderStyle.NONE },
                            left: { style: docx.BorderStyle.NONE },
                            right: { style: docx.BorderStyle.NONE },
                            insideHorizontal: { style: docx.BorderStyle.NONE },
                            insideVertical: { style: docx.BorderStyle.NONE },
                        },
                        rows: tableRows,
                    }),
                ],
            }],
        });

        docx.Packer.toBlob(doc).then(blob => {
            saveAs(blob, `${docTitle}.docx`);
        });
    }
</script>
</body>
</html>
