<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政府新聞稿雙排版工具</title>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 1000px; margin: auto; background-color: #f0f4f8; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; font-size: 24px; }
        
        /* 區塊樣式 */
        .section { 
            border: 2px solid #e0e6ed; 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 30px; 
            background-color: #fff;
            transition: border-color 0.3s;
        }
        .section:hover { border-color: #3498db; }
        .section-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .section-title i { margin-right: 10px; font-style: normal; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        
        /* 按鈕顏色區分 */
        .btn { color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 15px; width: 100%; font-weight: bold; transition: opacity 0.3s; }
        .btn:disabled { background-color: #95a5a6 !important; cursor: not-allowed; }
        .btn-info { background-color: #2c3e50; }
        .btn-tlb { background-color: #27ae60; }
        .btn:hover { opacity: 0.9; }

        #status { margin-top: 15px; font-weight: bold; text-align: center; height: 20px; }
        
        /* 預覽表格 */
        #preview-container { margin-top: 30px; display: none; }
        #preview { 
            border-collapse: collapse; 
            width: 100%; 
            font-size: 13px;
            table-layout: fixed;
            word-wrap: break-word;
        }
        #preview th, #preview td { border: 1px solid #ecf0f1; padding: 10px; text-align: left; vertical-align: top; width: 50%; white-space: pre-wrap; tab-size: 4; }
        #preview th { background-color: #f7f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 政府新聞稿一鍵 Word 排版工具</h1>

    <div class="section">
        <div class="section-title"><i>📰</i> 政府新聞公報專區 (info.gov.hk)</div>
        <div class="input-group">
            <label>中文網址：</label>
            <input type="text" id="zhUrlInfo" placeholder="https://www.info.gov.hk/gia/general/...">
        </div>
        <div class="input-group">
            <label>英文網址：</label>
            <input type="text" id="enUrlInfo" placeholder="https://www.info.gov.hk/gia/general/...">
        </div>
        <button class="btn btn-info" id="btnInfo" onclick="process('info')">📥 獲取並下載政府新聞公報 (DOCX)</button>
    </div>

    <div class="section">
        <div class="section-title"><i>🏢</i> 運輸及物流局 / 個別局署專區 (tlb.gov.hk)</div>
        <div class="input-group">
            <label>中文網址：</label>
            <input type="text" id="zhUrlOther" placeholder="https://www.tlb.gov.hk/tc/psp/pressreleases/...">
        </div>
        <div class="input-group">
            <label>英文網址：</label>
            <input type="text" id="enUrlOther" placeholder="https://www.tlb.gov.hk/eng/psp/pressreleases/...">
        </div>
        <button class="btn btn-tlb" id="btnOther" onclick="process('other')">📥 獲取並下載局署新聞稿 (DOCX)</button>
    </div>

    <p id="status"></p>

    <div id="preview-container">
        <h3 style="text-align: center;">內容預覽 (最近一次導出)</h3>
        <table id="preview">
            <thead>
                <tr><th>中文內容</th><th>英文內容</th></tr>
            </thead>
            <tbody id="previewBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- 通用工具函數 ---
    const stripLeadingWhitespace = (str) => (str || "").replace(/^[\s\u3000\xA0]+/g, '');

    async function fetchContent(url) {
        let htmlStr = null;
        const targetUrl = url.split('?')[0] + `?t=${Date.now()}`;
        const encodedUrl = encodeURIComponent(targetUrl);
        
        // 擴展代理伺服器列表，優先使用 raw 模式繞過解析錯誤
        const proxies = [
            { url: `https://api.allorigins.win/raw?url=${encodedUrl}`, type: 'text' },
            { url: `https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`, type: 'text' },
            { url: `https://corsproxy.io/?${encodedUrl}`, type: 'text' },
            { url: `https://api.allorigins.win/get?url=${encodedUrl}`, type: 'json' }
        ];

        for (const proxy of proxies) {
            try {
                console.log(`正在嘗試代理: ${proxy.url}`);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒超時強行切換
                
                const response = await fetch(proxy.url, { 
                    cache: 'no-store', 
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    htmlStr = (proxy.type === 'json') ? (await response.json()).contents : await response.text();
                    if (htmlStr && htmlStr.length > 500) {
                        console.log(`✅ 代理成功: ${proxy.url}`);
                        break;
                    }
                }
            } catch (e) {
                console.warn(`⚠️ 代理請求失敗 (${proxy.url}):`, e.message);
            }
        }
        
        if (!htmlStr) throw new Error('無法抓取內容。政府網頁防火牆可能暫時阻擋了代理連線，請稍後再試。');
        
        const doc = new DOMParser().parseFromString(htmlStr, "text/html");

        function extractText(node) {
            if (!node) return "";
            let text = "";
            for (let child of node.childNodes) {
                if (child.nodeType === 3) text += child.nodeValue;
                else if (child.nodeType === 1) {
                    const tag = child.tagName.toLowerCase();
                    if (tag === "br") text += "\n";
                    else if (["p", "div", "h1", "h2", "h3", "li", "tr", "article", "section"].includes(tag)) {
                        text += "\n" + extractText(child) + "\n";
                    }
                    else text += extractText(child);
                }
            }
            return text;
        }

        const titleNode = doc.getElementById("pr_title") || doc.querySelector("h1") || doc.querySelector(".title");
        const bodyNode = doc.getElementById("pressrelease") || 
                         doc.querySelector(".pressrelease") || 
                         doc.getElementById("content") || 
                         doc.querySelector(".content") || 
                         doc.querySelector("article") || 
                         doc.body;
        
        // 🛡️ 徹底移除 script 代碼塊，防止 createPress(); 等代碼殘留
        bodyNode.querySelectorAll("script, style, noscript, iframe, nav").forEach(el => el.remove());

        // 表格抽取
        const tablesData = [];
        const tables = Array.from(bodyNode.querySelectorAll("table")).filter(t => !t.querySelector("table"));
        tables.forEach((table) => {
            // 🛡️ 攔截 TLB 網頁用來排版的「導航選單表格」
            const tText = table.innerText.toLowerCase().replace(/\s+/g, '');
            const isNavTable = tText.includes("createtopmenu") || 
                               tText.includes("createpress") || 
                               (tText.includes("主頁") && tText.includes("home")) ||
                               (tText.includes("新聞公報") && tText.includes("pressreleases"));
                               
            if (isNavTable) {
                table.remove(); 
                return; 
            }

            let rowData = [];
            table.querySelectorAll("tr").forEach(tr => {
                let cellData = Array.from(tr.children)
                    .filter(c => c.tagName === 'TD' || c.tagName === 'TH')
                    .map(c => c.innerText.trim());
                if (cellData.length > 0 && cellData.some(text => text.length > 0)) {
                    rowData.push(cellData);
                }
            });
            if (rowData.length > 0) {
                tablesData.push(rowData);
                const placeholder = doc.createTextNode(`\n[[[TABLE_${tablesData.length - 1}]]]\n`);
                if (table.parentNode) table.parentNode.replaceChild(placeholder, table);
            }
        });

        const titleText = titleNode ? extractText(titleNode).replace(/[\r\n]+/g, " ").trim() : "";
        let paras = extractText(bodyNode).split('\n').map(p => p.trim()).filter(p => p.length > 0);
        
        paras = paras.filter(p => {
            const strForMatch = p.toLowerCase().replace(/\s+/g, '');
            if (strForMatch.includes("createtopmenu") || 
                strForMatch.includes("createpress") || 
                strForMatch.includes("createsitemap") || 
                strForMatch.includes("createfooter")) {
                return false; 
            }
            const exactJunk = [
                "主頁", "home",
                "新聞公報及演講辭", "pressreleasesandspeeches",
                "新聞公報", "pressreleases",
                "press", "releasesandspeeches", "releases",
                "go" 
            ];
            if (exactJunk.includes(strForMatch)) return false; 
            return true; 
        });
        
        let cleanTitle = doc.title || "";
        cleanTitle = cleanTitle.replace(/(\s*[-|]\s*)?(Press Release|News|新聞公報|運輸及物流局|TLB).*$/i, "").trim();

        return { title: titleText || cleanTitle, paras, tables: tablesData };
    }

    // --- 核心解析分流 ---
    function parseInfoGov(data) {
        let body = data.paras;
        const starIdx = body.findIndex(p => {
            const c = p.replace(/\s/g, '');
            return c.length >= 3 && (/^[\*\uFF0A]+$/.test(c) || c.includes('***') || c.includes('＊＊聲＊'));
        });
        if (starIdx !== -1) body = body.slice(starIdx + 1);

        let firstReal = 0;
        for (let i = 0; i < Math.min(5, body.length); i++) {
            if (body[i].match(/\d{4}年|January|Issued|Ends|完|HKT/)) firstReal = i + 1;
            else break;
        }
        return { title: data.title, body: body.slice(firstReal), tables: data.tables };
    }

    function parseOtherGov(data) {
        let title = data.title;
        let body = data.paras;
        const lcqIdx = body.findIndex(p => p.match(/LCQ\d+|立法會.+題/i));
        if (lcqIdx !== -1) {
            title = body[lcqIdx];
            body = body.slice(lcqIdx + 1);
        } else if (body.length > 0 && title.length < 10) {
            title = body[0];
            body = body.slice(1);
        }
        return { title, body, tables: data.tables };
    }

    // --- 執行程序 ---
    async function process(mode) {
        const zhId = mode === 'info' ? 'zhUrlInfo' : 'zhUrlOther';
        const enId = mode === 'info' ? 'enUrlInfo' : 'enUrlOther';
        const btnId = mode === 'info' ? 'btnInfo' : 'btnOther';
        
        const zhUrl = document.getElementById(zhId).value.trim();
        const enUrl = document.getElementById(enId).value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById(btnId);

        if (!zhUrl || !enUrl) { alert("請輸入網址"); return; }

        try {
            btn.disabled = true;
            status.style.color = "#2c3e50";
            status.innerText = "⏳ 處理中 (正在嘗試多個代理伺服器)...";
            const [zhRaw, enRaw] = await Promise.all([fetchContent(zhUrl), fetchContent(enUrl)]);
            
            const zhData = mode === 'info' ? parseInfoGov(zhRaw) : parseOtherGov(zhRaw);
            const enData = mode === 'info' ? parseInfoGov(enRaw) : parseOtherGov(enRaw);

            const zhStars = "＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊聲＊";
            const enStars = "********************************************";
            const cleanZhUrl = zhUrl.replace(/\?fontSize=\d+/g, "");
            const cleanEnUrl = enUrl.replace(/\?fontSize=\d+/g, "");

            const finalZh = [zhData.title, zhStars, cleanZhUrl, ...zhData.body.map(p => "\t" + stripLeadingWhitespace(p))];
            const finalEn = [enData.title, enStars, cleanEnUrl, ...enData.body.map(p => "\t" + stripLeadingWhitespace(p))];

            // 更新預覽
            const previewBody = document.getElementById('previewBody');
            previewBody.innerHTML = "";
            const maxLen = Math.max(finalZh.length, finalEn.length);
            for (let i = 0; i < maxLen; i++) {
                previewBody.innerHTML += `<tr><td>${finalZh[i] || ""}</td><td>${finalEn[i] || ""}</td></tr>`;
            }
            document.getElementById('preview-container').style.display = "block";

            const fileName = enData.title.replace(/[\\/:*?"<>|]/g, "_").replace(/[\r\n]+/g, " ").trim() || "Press_Release";
            generateDocx(finalZh, finalEn, maxLen, fileName, zhData.tables, enData.tables);
            
            status.style.color = "#27ae60";
            status.innerText = "✅ 完成！檔案已下載。";
        } catch (e) {
            status.style.color = "#c0392b";
            status.innerText = "❌ 錯誤: " + e.message;
            console.error(e);
        } finally { btn.disabled = false; }
    }

    // --- Word 生成引擎 ---
    function generateDocx(zhParas, enParas, maxLen, docTitle, zhTables, enTables) {
        const tableRows = [];
        const formatTextRules = (text) => {
            let n = (text || "").replace(/（/g, '(').replace(/）/g, ')');
            // 【已修正死迴圈】：使用 [, ] 確保不與 \u00A0 衝突
            while (/(\d)[, ](\d{3})(?!\d)/.test(n)) n = n.replace(/(\d)[, ](\d{3})(?!\d)/g, '$1\u00A0$2');
            return n.replace(/(\d{3,})\s*([a-zA-Z\u4e00-\u9fa5])/g, '$1\u00A0$2');
        };

        const createZhParagraph = (text, isBold = false, isUrl = false) => {
            text = text || "";
            if (!isUrl) text = formatTextRules(text);
            const runs = [];
            
            if (text.startsWith('\t')) {
                runs.push(new docx.TextRun("\t"));
                text = text.substring(1);
            }

            const tokens = text.split(/(○|\d+)/g).filter(Boolean);
            tokens.forEach(token => {
                let fontName = undefined; 
                if (token === "○") { fontName = "PMingLiU"; } 
                else if (/^\d+$/.test(token)) { fontName = "Times New Roman"; }

                runs.push(new docx.TextRun({
                    text: token, size: 20, font: fontName, characterSpacing: isUrl ? undefined : 20, bold: isBold
                }));
            });

            return new docx.Paragraph({ children: runs, alignment: isUrl ? docx.AlignmentType.LEFT : docx.AlignmentType.JUSTIFIED, keepLines: true, widowControl: true });
        };

        const createEnParagraph = (text, isBold = false, isUrl = false) => {
            text = text || "";
            if (!isUrl) text = formatTextRules(text);
            const runs = [];
            
            if (text.startsWith('\t')) {
                runs.push(new docx.TextRun("\t"));
                text = text.substring(1);
            }
            
            runs.push(new docx.TextRun({
                text: text, size: 18, font: "Times New Roman", bold: isBold
            }));
            
            return new docx.Paragraph({ children: runs, alignment: isUrl ? docx.AlignmentType.LEFT : docx.AlignmentType.JUSTIFIED, keepLines: true, widowControl: true });
        };

        const createNestedTable = (tableData, isZh) => {
            if (!tableData || tableData.length === 0) {
                return new docx.Table({ rows: [new docx.TableRow({ children: [new docx.TableCell({ children: [new docx.Paragraph("")] })]})] });
            }

            let maxCols = Math.max(...tableData.map(r => r.length));

            const rows = tableData.map(row => {
                const cells = [...row];
                while (cells.length < maxCols) cells.push(""); 

                return new docx.TableRow({
                    cantSplit: true, 
                    children: cells.map(cellText => {
                        return new docx.TableCell({
                            margins: { top: 60, bottom: 60, left: 60, right: 60 },
                            children: [isZh ? createZhParagraph(cellText || "") : createEnParagraph(cellText || "")]
                        });
                    })
                });
            });

            return new docx.Table({
                width: { size: 100, type: docx.WidthType.PERCENTAGE }, 
                layout: docx.TableLayoutType.AUTOFIT, // 內部自動調整欄寬
                rows: rows,
                borders: {
                    top: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    left: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    right: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    insideHorizontal: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                    insideVertical: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                }
            });
        };

        for (let i = 0; i < maxLen; i++) {
            const zhText = zhParas[i] || "";
            const enText = enParas[i] || "";
            const isTitle = (i === 0);
            const isUrlRow = zhText.trim().startsWith("http"); 
            
            const zhTableMatch = zhText.match(/\[\[\[TABLE_(\d+)\]\]\]/);
            const enTableMatch = enText.match(/\[\[\[TABLE_(\d+)\]\]\]/);

            let zhContent, enContent;

            if (zhTableMatch && zhTables && zhTables[zhTableMatch[1]]) {
                zhContent = createNestedTable(zhTables[zhTableMatch[1]], true);
            } else {
                zhContent = createZhParagraph(zhText, isTitle, isUrlRow);
            }

            if (enTableMatch && enTables && enTables[enTableMatch[1]]) {
                enContent = createNestedTable(enTables[enTableMatch[1]], false);
            } else {
                enContent = createEnParagraph(enText, isTitle, isUrlRow);
            }
            
            tableRows.push(
                new docx.TableRow({
                    cantSplit: true,
                    children: [
                        new docx.TableCell({
                            width: { size: 50, type: docx.WidthType.PERCENTAGE },
                            margins: { top: 0, bottom: 0, left: 108, right: 108 },
                            children: [zhContent, new docx.Paragraph({ text: "" })],
                        }),
                        new docx.TableCell({
                            width: { size: 50, type: docx.WidthType.PERCENTAGE },
                            margins: { top: 0, bottom: 0, left: 108, right: 108 },
                            children: [enContent, new docx.Paragraph({ text: "" })],
                        }),
                    ],
                })
            );
        }

        const doc = new docx.Document({
            sections: [{
                properties: { page: { margin: { top: 567, bottom: 567, left: 567, right: 567 } } },
                children: [
                    new docx.Table({
                        width: { size: 100, type: docx.WidthType.PERCENTAGE },
                        layout: docx.TableLayoutType.FIXED, // 外層雙欄強制等寬固定
                        borders: {
                            top: { style: docx.BorderStyle.NONE },
                            bottom: { style: docx.BorderStyle.NONE },
                            left: { style: docx.BorderStyle.NONE },
                            right: { style: docx.BorderStyle.NONE },
                            insideHorizontal: { style: docx.BorderStyle.NONE },
                            insideVertical: { style: docx.BorderStyle.NONE },
                        },
                        rows: tableRows,
                    }),
                ],
            }],
        });

        docx.Packer.toBlob(doc).then(blob => {
            saveAs(blob, `${docTitle}.docx`);
        });
    }
</script>
</body>
</html>
