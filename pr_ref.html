<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政府新聞稿雙排版工具</title>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 1000px; margin: auto; background-color: #f0f4f8; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; font-size: 24px; }
        
        /* 區塊樣式 */
        .section { 
            border: 2px solid #e0e6ed; 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 30px; 
            background-color: #fff;
            transition: border-color 0.3s;
        }
        .section:hover { border-color: #3498db; }
        .section-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .section-title i { margin-right: 10px; font-style: normal; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        
        /* 按鈕顏色區分 */
        .btn { color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 15px; width: 100%; font-weight: bold; transition: opacity 0.3s; }
        .btn:disabled { background-color: #95a5a6 !important; cursor: not-allowed; }
        .btn-info { background-color: #2c3e50; }
        .btn-tlb { background-color: #27ae60; }
        .btn:hover { opacity: 0.9; }

        #status { margin-top: 15px; font-weight: bold; text-align: center; height: 20px; }
        
        /* 預覽表格 */
        #preview-container { margin-top: 30px; display: none; }
        #preview { 
            border-collapse: collapse; 
            width: 100%; 
            font-size: 13px;
            table-layout: fixed;
            word-wrap: break-word;
        }
        #preview th, #preview td { border: 1px solid #ecf0f1; padding: 10px; text-align: left; vertical-align: top; width: 50%; white-space: pre-wrap; }
        #preview th { background-color: #f7f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 政府新聞稿一鍵 Word 排版工具</h1>

    <div class="section">
        <div class="section-title"><i>📰</i> 政府新聞公報專區 (info.gov.hk)</div>
        <div class="input-group">
            <label>中文網址：</label>
            <input type="text" id="zhUrlInfo" placeholder="https://www.info.gov.hk/gia/general/...">
        </div>
        <div class="input-group">
            <label>英文網址：</label>
            <input type="text" id="enUrlInfo" placeholder="https://www.info.gov.hk/gia/general/...">
        </div>
        <button class="btn btn-info" id="btnInfo" onclick="process('info')">📥 獲取並下載政府新聞公報 (DOCX)</button>
    </div>

    <div class="section">
        <div class="section-title"><i>🏢</i> 運輸及物流局 / 個別局署專區 (tlb.gov.hk)</div>
        <div class="input-group">
            <label>中文網址：</label>
            <input type="text" id="zhUrlOther" placeholder="https://www.tlb.gov.hk/tc/psp/pressreleases/...">
        </div>
        <div class="input-group">
            <label>英文網址：</label>
            <input type="text" id="enUrlOther" placeholder="https://www.tlb.gov.hk/eng/psp/pressreleases/...">
        </div>
        <button class="btn btn-tlb" id="btnOther" onclick="process('other')">📥 獲取並下載局署新聞稿 (DOCX)</button>
    </div>

    <p id="status"></p>

    <div id="preview-container">
        <h3 style="text-align: center;">內容預覽 (最近一次導出)</h3>
        <table id="preview">
            <thead>
                <tr><th>中文內容</th><th>英文內容</th></tr>
            </thead>
            <tbody id="previewBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- 通用工具函數 ---
    const stripLeadingWhitespace = (str) => (str || "").replace(/^[\s\u3000\xA0]+/g, '');

    async function fetchContent(url) {
        let htmlStr = null;
        const targetUrl = url.split('?')[0] + `?t=${Date.now()}`;
        const proxies = [
            { url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`, type: 'json' },
            { url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, type: 'text' }
        ];

        for (const proxy of proxies) {
            try {
                const response = await fetch(proxy.url);
                if (response.ok) {
                    htmlStr = (proxy.type === 'json') ? (await response.json()).contents : await response.text();
                    if (htmlStr && htmlStr.length > 500) break;
                }
            } catch (e) {}
        }
        if (!htmlStr) throw new Error('無法抓取內容，請檢查網址。');
        
        const doc = new DOMParser().parseFromString(htmlStr, "text/html");

        function extractText(node) {
            if (!node) return "";
            let text = "";
            for (let child of node.childNodes) {
                if (child.nodeType === 3) text += child.nodeValue;
                else if (child.nodeType === 1) {
                    const tag = child.tagName.toLowerCase();
                    if (tag === "br") text += "\n";
                    else if (["p", "div", "h1", "h2", "h3", "li", "tr"].includes(tag)) text += "\n" + extractText(child) + "\n";
                    else text += extractText(child);
                }
            }
            return text;
        }

        const titleNode = doc.getElementById("pr_title") || doc.querySelector("h1");
        const bodyNode = doc.getElementById("pressrelease") || doc.querySelector(".pressrelease") || doc.getElementById("content") || doc.querySelector(".content") || doc.body;
        
        // 表格抽取
        const tablesData = [];
        const tables = Array.from(bodyNode.querySelectorAll("table")).filter(t => !t.querySelector("table"));
        tables.forEach((table, index) => {
            let rowData = [];
            table.querySelectorAll("tr").forEach(tr => {
                let cellData = Array.from(tr.children).filter(c => c.tagName === 'TD' || c.tagName === 'TH').map(c => c.innerText.trim());
                if (cellData.length > 0) rowData.push(cellData);
            });
            if (rowData.length > 0) {
                tablesData.push(rowData);
                const placeholder = doc.createTextNode(`\n[[[TABLE_${tablesData.length - 1}]]]\n`);
                table.parentNode.replaceChild(placeholder, table);
            }
        });

        const titleText = titleNode ? extractText(titleNode).replace(/[\r\n]+/g, " ").trim() : "";
        const paras = extractText(bodyNode).split('\n').map(p => p.trim()).filter(p => p.length > 0)
            .filter(p => !p.toLowerCase().replace(/\s/g, '').includes("createtopmenu"));
        
        let cleanTitle = doc.title || "";
        cleanTitle = cleanTitle.replace(/(\s*[-|]\s*)?(Press Release|News|新聞公報|運輸及物流局|TLB).*$/i, "").trim();

        return { title: titleText || cleanTitle, paras, tables: tablesData };
    }

    // --- 核心解析分流 ---
    function parseInfoGov(data) {
        let body = data.paras;
        const starIdx = body.findIndex(p => {
            const c = p.replace(/\s/g, '');
            return c.length >= 3 && (/^[\*\uFF0A]+$/.test(c) || c.includes('***') || c.includes('＊＊＊'));
        });
        if (starIdx !== -1) body = body.slice(starIdx + 1);

        let firstReal = 0;
        for (let i = 0; i < Math.min(5, body.length); i++) {
            if (body[i].match(/\d{4}年|January|Issued|Ends|完|HKT/)) firstReal = i + 1;
            else break;
        }
        return { title: data.title, body: body.slice(firstReal), tables: data.tables };
    }

    function parseOtherGov(data) {
        let title = data.title;
        let body = data.paras;
        const lcqIdx = body.findIndex(p => p.match(/LCQ\d+|立法會.+題/i));
        if (lcqIdx !== -1) {
            title = body[lcqIdx];
            body = body.slice(lcqIdx + 1);
        } else if (body.length > 0 && title.length < 10) {
            title = body[0];
            body = body.slice(1);
        }
        return { title, body, tables: data.tables };
    }

    // --- 執行程序 ---
    async function process(mode) {
        const zhId = mode === 'info' ? 'zhUrlInfo' : 'zhUrlOther';
        const enId = mode === 'info' ? 'enUrlInfo' : 'enUrlOther';
        const btnId = mode === 'info' ? 'btnInfo' : 'btnOther';
        
        const zhUrl = document.getElementById(zhId).value.trim();
        const enUrl = document.getElementById(enId).value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById(btnId);

        if (!zhUrl || !enUrl) { alert("請輸入網址"); return; }

        try {
            btn.disabled = true;
            status.innerText = "⏳ 處理中...";
            const [zhRaw, enRaw] = await Promise.all([fetchContent(zhUrl), fetchContent(enUrl)]);
            
            const zhData = mode === 'info' ? parseInfoGov(zhRaw) : parseOtherGov(zhRaw);
            const enData = mode === 'info' ? parseInfoGov(enRaw) : parseOtherGov(enRaw);

            const zhStars = "＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊";
            const enStars = "********************************************";
            const cleanZhUrl = zhUrl.replace(/\?fontSize=\d+/g, "");
            const cleanEnUrl = enUrl.replace(/\?fontSize=\d+/g, "");

            const finalZh = [zhData.title, zhStars, cleanZhUrl, ...zhData.body.map(p => "\t" + stripLeadingWhitespace(p))];
            const finalEn = [enData.title, enStars, cleanEnUrl, ...enData.body.map(p => "\t" + stripLeadingWhitespace(p))];

            // 更新預覽
            const previewBody = document.getElementById('previewBody');
            previewBody.innerHTML = "";
            const maxLen = Math.max(finalZh.length, finalEn.length);
            for (let i = 0; i < maxLen; i++) {
                previewBody.innerHTML += `<tr><td>${finalZh[i] || ""}</td><td>${finalEn[i] || ""}</td></tr>`;
            }
            document.getElementById('preview-container').style.display = "block";

            const fileName = enData.title.replace(/[\\/:*?"<>|]/g, "_").replace(/[\r\n]+/g, " ").trim() || "Press_Release";
            generateDocx(finalZh, finalEn, maxLen, fileName, zhData.tables, enData.tables);
            
            status.innerText = "✅ 完成！檔案已下載。";
        } catch (e) {
            status.innerText = "❌ 錯誤: " + e.message;
        } finally { btn.disabled = false; }
    }

    // --- Word 生成引擎 ---
    function generateDocx(zhParas, enParas, maxLen, docTitle, zhTables, enTables) {
        const tableRows = [];
        const formatTextRules = (text) => {
            let n = (text || "").replace(/（/g, '(').replace(/）/g, ')');
            while (/(\d)[, ](\d{3})(?!\d)/.test(n)) n = n.replace(/(\d)[, ](\d{3})(?!\d)/g, '$1\u00A0$2');
            return n.replace(/(\d{3,})\s*([a-zA-Z\u4e00-\u9fa5])/g, '$1\u00A0$2');
        };

        const createPara = (text, isZh, isBold, isUrl) => {
            let processed = isUrl ? text : formatTextRules(text);
            const runs = [];
            if (processed.startsWith('\t')) { runs.push(new docx.TextRun("\t")); processed = processed.substring(1); }
            
            const tokens = isZh ? processed.split(/(○|\d+)/g).filter(Boolean) : [processed];
            tokens.forEach(t => {
                let font = isZh ? (t === "○" ? "PMingLiU" : (/^\d+$/.test(t) ? "Times New Roman" : undefined)) : "Times New Roman";
                runs.push(new docx.TextRun({ text: t, size: isZh ? 20 : 18, font, characterSpacing: (isZh && !isUrl) ? 20 : undefined, bold: isBold }));
            });
            return new docx.Paragraph({ children: runs, alignment: isUrl ? docx.AlignmentType.LEFT : docx.AlignmentType.JUSTIFIED, keepLines: true, widowControl: true });
        };

        const createNestTable = (data, isZh) => {
            let maxCols = Math.max(...data.map(r => r.length));
            return new docx.Table({
                width: { size: 100, type: docx.WidthType.PERCENTAGE },
                layout: docx.TableLayoutType.AUTOFIT,
                rows: data.map(row => {
                    while (row.length < maxCols) row.push("");
                    return new docx.TableRow({ cantSplit: true, children: row.map(c => new docx.TableCell({ margins: { top: 60, bottom: 60, left: 60, right: 60 }, children: [createPara(c, isZh, false, false)] })) });
                }),
                borders: { top: { style: 'single', size: 1 }, bottom: { style: 'single', size: 1 }, left: { style: 'single', size: 1 }, right: { style: 'single', size: 1 }, insideHorizontal: { style: 'single', size: 1 }, insideVertical: { style: 'single', size: 1 } }
            });
        };

        for (let i = 0; i < maxLen; i++) {
            const zhT = zhParas[i] || ""; const enT = enParas[i] || "";
            const isUrl = zhT.trim().startsWith("http");
            const zhM = zhT.match(/\[\[\[TABLE_(\d+)\]\]\]/); const enM = enT.match(/\[\[\[TABLE_(\d+)\]\]\]/);

            tableRows.push(new docx.TableRow({
                cantSplit: true,
                children: [
                    new docx.TableCell({ width: { size: 50, type: docx.WidthType.PERCENTAGE }, margins: { left: 108, right: 108 }, children: [zhM ? createNestTable(zhTables[zhM[1]], true) : createPara(zhT, true, i===0, isUrl), new docx.Paragraph("")] }),
                    new docx.TableCell({ width: { size: 50, type: docx.WidthType.PERCENTAGE }, margins: { left: 108, right: 108 }, children: [enM ? createNestTable(enTables[enM[1]], false) : createPara(enT, false, i===0, isUrl), new docx.Paragraph("")] })
                ]
            }));
        }

        const doc = new docx.Document({
            sections: [{ properties: { page: { margin: { top: 567, bottom: 567, left: 567, right: 567 } } }, children: [new docx.Table({ width: { size: 100, type: docx.WidthType.PERCENTAGE }, layout: docx.TableLayoutType.FIXED, borders: docx.TableBorders.NONE, rows: tableRows })] }]
        });
        docx.Packer.toBlob(doc).then(blob => saveAs(blob, `${docTitle}.docx`));
    }
</script>
</body>
</html>
